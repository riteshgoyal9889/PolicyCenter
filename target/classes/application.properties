# Store the H2 database in a file under the project's data folder
spring.datasource.url=jdbc:h2:file:./data/policydb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Keep the schema between application restarts
spring.jpa.hibernate.ddl-auto=update

# Show SQL statements in the application console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Enable the local development H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false